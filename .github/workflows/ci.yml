name: CI

# The deterministic pre-merge gate (Roadmap/WAYS-OF-WORKING.md → Review & merge).
#   changes          — is this PR docs-only? (scripts/ci-changes.mjs; exclusion-only, unsure ⇒ run everything)
#   typecheck-build  — every static check, cheapest first, then typecheck + build. Always runs.
#   e2e-api, e2e-authed, design-contract — in parallel, skipped only on a docs-only PR. The e2e jobs run Playwright
#                      against a LOCAL Supabase and locally built servers: the suite needs a database it can seed and
#                      clean, plus a second, differently-enved server to prove the dark contracts. A Vercel preview
#                      offers neither (it points at production Supabase and carries one env set).
#   verify-outbox, verify-flags — the model checks (verify-module D4/D5), only when `changes` says the PR touches the
#                      outbox or the flag evaluator: the Quint simulation, and the Lean proofs + differential test.
#   gate             — the one required check (scripts/ci-gate.mjs, ci-diet D3).
# Minutes: the repo is public, so GitHub-hosted standard runners are free and wall clock is the scarce thing.
# If the repo ever goes private again, revisit the job split (ci-diet D9).

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Docs-only?
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.diff.outputs.docs_only }}
      verify_outbox: ${{ steps.diff.outputs.verify_outbox }}
      verify_flags: ${{ steps.diff.outputs.verify_flags }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: diff
        run: node scripts/ci-changes.mjs "$BASE" "$HEAD" >> "$GITHUB_OUTPUT"
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}

  typecheck-build:
    name: Static gate + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # format-changed and the coverage ratchet diff against the PR base; a shallow clone makes them no-op
          # silently.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      # Zero-dependency guards run before install, so drift fails fast and cheap.
      - name: Template-drift guard
        run: node scripts/check-template-drift.mjs
      - name: BUILD-ORDER.md is up to date
        run: node scripts/build-order.mjs --check
      # The owed ledger is generated from the specs and the epic docs; a doc that adds or clears an owed line
      # regenerates it in the same PR.
      - name: OWED-LEDGER.md is up to date
        run: node scripts/owed-ledger.mjs --check
      # A model can't drift from the code it mirrors (verify-module D3): every PR, since a migration of any name can
      # redefine a mirrored function.
      - name: Verify models are pinned to the code they mirror
        run: node scripts/verify-pins.mjs
      # Replay only. Shadow expiry is a DATE, so here it would turn every unrelated PR red; jev-expiry.yml runs it
      # daily instead, and that red run is what forces the promote/tune/drop decision.
      - name: Jev — eval replay
        run: node scripts/jev-eval.mjs --no-expiry
      - name: Permissions contract
        run: node scripts/permissions-smoke.mjs
      - name: Script parity with the template
        run: node scripts/check-script-parity.mjs
      - name: Design-drift guard
        run: node scripts/check-design-drift.mjs
      # The brand domain only: no Vercel deployment host in docs, workflows or tests (launch-trust-sweep S1.2).
      - name: Brand host
        run: node scripts/check-brand-host.mjs
      # Old names keep working inside a dated window, then go (plugin-1-0 D3, D5): the CLI's gf until its date; the kit's
      # old name went in kit 1.1.0, and this keeps it gone and keeps shipped text off old commands.
      - name: Deprecations (gf; the retired kit name)
        run: node scripts/check-deprecations.mjs
      # The skills CI checks the plugin's own copies; this adds the root Roadmap's copies of the gate wording
      # (gates-in-plain-agile D9).
      - name: Gate words stay off the screen (root Roadmap copies)
        run: >-
          node skills/scripts/check-gate-words.mjs --also Roadmap/WAYS-OF-WORKING.md Roadmap/WAYS-OF-WORKING.template.md
          Roadmap/SESSION-KICKOFFS.md Roadmap/bets/README.md Roadmap/00-ideas/README.md

      - run: npm ci --no-audit --no-fund
      - name: Lint
        run: npm run lint
      # New files only — the script's header says why modified legacy files are exempt.
      - name: Format (files this PR adds)
        env:
          PRETTIER_BASE_REF: ${{ github.event.pull_request.base.sha }}
        run: npm run format:changed
      # Every node:test under scripts/, optimize/, apps/web and packages — ~1s, so it runs in front of the build.
      - name: Unit tests (pure logic)
        run: npm run test:unit
      # A quarantined test needs an owner and an expiry ≤ 30 days out; past it, this goes red (ci-diet D7).
      - name: Every quarantine has an owner and a date
        run: node scripts/check-quarantine.mjs
      - name: The generated design contract is in sync with the approved prototype
        run: node apps/web/design-system/extract-css.mjs --check
      # The ratchet diffs against the PR base, which resolves because this workflow is pull_request-only; the
      # script refuses an empty base rather than passing. pipefail, because bash -e alone reports tee's status.
      - name: Design coverage + ratchet
        env:
          COVERAGE_BASE_REF: ${{ github.event.pull_request.base.sha }}
        run: |
          set -o pipefail
          node scripts/design-coverage.mjs --check | tee -a "$GITHUB_STEP_SUMMARY"
      # Four tsconfig projects (app, app tests, sdk, cli + their tests): `tsc -p apps/web` alone is a subset.
      - name: Type-check (app + tests, web + sdk + cli)
        run: npm run typecheck
      - name: Build
        run: npm run build

  e2e-api:
    name: e2e · api (+ the OFF server)
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/e2e-setup

      # Gates come from ci/gates.{off,on}.env, loaded into $GITHUB_ENV before the server that reads them boots, so
      # the server and the test process after it agree by construction (ci-diet D4).
      - name: Load the OFF gates
        run: node scripts/lib/gate-env.mjs ci/gates.off.env >> "$GITHUB_ENV"

      # The dark contracts, against a real second server with every gate off. Every spec here branches on its gate.
      - name: Verify the dark contracts with every gate OFF
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3100
        run: |
          set -euo pipefail
          ./node_modules/.bin/next start apps/web --hostname 127.0.0.1 --port 3100 > /tmp/off-server.log 2>&1 &
          off_pid=$!
          # SIGTERM, then SIGKILL after 2s: a server that ignores TERM must not hang the job.
          trap 'kill "$off_pid" 2>/dev/null || true; sleep 2; kill -9 "$off_pid" 2>/dev/null || true; wait "$off_pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:3100/llms.txt > /dev/null && break; sleep 1; done
          curl -sf http://127.0.0.1:3100/llms.txt > /dev/null || { echo "::error::OFF app never became ready"; cat /tmp/off-server.log; exit 1; }
          ./node_modules/.bin/playwright test --config=apps/web/playwright.config.ts --project=api --grep-invert @quarantine \
            apps/web/e2e/journey-dark.spec.ts \
            apps/web/e2e/experiment-governance-dark.spec.ts \
            apps/web/e2e/scenario-dark.spec.ts \
            apps/web/e2e/setup-routes-dark.spec.ts \
            apps/web/e2e/flag-console-dark.spec.ts \
            apps/web/e2e/first-event-dark.spec.ts \
            apps/web/e2e/flag-funnel-dark.spec.ts \
            apps/web/e2e/funnel-trend-pages.spec.ts \
            apps/web/e2e/cli-scenarios.spec.ts \
            apps/web/e2e/signup.spec.ts \
            || { cat /tmp/off-server.log; exit 1; }

      - uses: ./.github/actions/e2e-on-server
      # Quarantined tests run in the `quarantine` job instead (ci-diet D7).
      - name: Run Playwright api suite
        run: npx playwright test --config=apps/web/playwright.config.ts --project=api --grep-invert @quarantine
      - uses: ./.github/actions/failure-evidence
        if: failure()
        with:
          name: e2e-api-failure

  e2e-authed:
    name: e2e · authed (incl. the console visual gate)
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/e2e-setup
      - uses: ./.github/actions/e2e-on-server
      - uses: ./.github/actions/chromium
      # The WHOLE authed project, never a file list: a hand-maintained list missed seven suites, one at a time.
      # auth-setup / auth-teardown run as its dependency graph.
      - name: Run Playwright authed suite
        run: npx playwright test --config=apps/web/playwright.config.ts --project=authed --grep-invert @quarantine
      - name: Upload the visual gate's screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: console-visual
          path: |
            test-results/console-visual/
            test-results/design-system/
          if-no-files-found: ignore
      - uses: ./.github/actions/failure-evidence
        if: failure()
        with:
          name: e2e-authed-failure

  # Known flakes, tagged @quarantine with an owner and an expiry. They run and report here, and never block: this job
  # is deliberately NOT in `gate`'s needs. The static job's quarantine check turns `gate` red past an expiry.
  quarantine:
    name: Quarantined tests (non-blocking)
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/e2e-setup
      - uses: ./.github/actions/e2e-on-server
      - uses: ./.github/actions/chromium
      - id: run
        continue-on-error: true
        run: npx playwright test --config=apps/web/playwright.config.ts --project=api --project=authed --grep @quarantine --pass-with-no-tests
      - name: Report
        if: always()
        run: |
          node scripts/check-quarantine.mjs || true
          echo "**Result: ${{ steps.run.outcome }}** (reported, not blocking)" >> "$GITHUB_STEP_SUMMARY"
          [ "${{ steps.run.outcome }}" = success ] || echo "::warning::A quarantined test failed (see the job summary and the uploaded trace)."
      # Always: a flaky pass is evidence too, and it is exactly what the quarantine's fix needs.
      - uses: ./.github/actions/failure-evidence
        if: always()
        with:
          name: quarantine-evidence

  # Opens the approved prototype at file:// in a real browser: no Supabase, no server (lock C2). The measured spec
  # and the state contract must reproduce, and every approved state must render.
  design-contract:
    name: Design contract (measured spec, state contract, approved states)
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - uses: ./.github/actions/chromium
      - run: node apps/web/design-system/measure-contract.mjs --check
      - run: node apps/web/design-system/state-contract.mjs --check
      - run: node apps/web/design-system/render-reference.mjs

  # The outbox's Quint model, simulated over 7 invariants in both timing modes, then a mutant it must catch
  # (verify/quint/check.sh holds the one expected table). The exhaustive check is nightly (verify-nightly.yml).
  verify-outbox:
    name: Model check · outbox
    needs: changes
    if: needs.changes.outputs.verify_outbox == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # Quint's simulator downloads its evaluator into ~/.quint on first use.
      - uses: actions/cache@v6
        with:
          path: ~/.quint
          key: quint-0.33.0-${{ runner.os }}
      - name: Simulation table
        run: bash verify/quint/check.sh quick
      - name: Teeth — a mutant model must fail the table
        run: bash verify/quint/check.sh teeth

  # The flag evaluator's Lean proofs, the axioms check and the differential test against packages/sdk/src/flags.ts,
  # then the whitespace mutant it must catch (verify/lean/check.sh; rule 4 in verify/README.md).
  verify-flags:
    name: Proofs + differential test · flags
    needs: changes
    if: needs.changes.outputs.verify_flags == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/cache@v6
        with:
          path: ~/.elan
          key: elan-${{ runner.os }}-${{ hashFiles('verify/lean/lean-toolchain') }}
      - uses: actions/cache@v6
        with:
          path: verify/lean/.lake
          key: lake-${{ runner.os }}-${{ hashFiles('verify/lean/lean-toolchain', 'verify/lean/lake-manifest.json', 'verify/lean/**/*.lean') }}
          restore-keys: lake-${{ runner.os }}-
      - name: Install elan, pinned (the toolchain itself comes from lean-toolchain)
        run: |
          if [ ! -x "$HOME/.elan/bin/elan" ]; then
            curl -sSfL https://raw.githubusercontent.com/leanprover/elan/v4.2.4/elan-init.sh | sh -s -- -y --default-toolchain none
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Build · axioms · differential test · teeth
        run: bash verify/lean/check.sh

  # The one check the ruleset requires. Green only when every job succeeded, or was skipped because `changes` said the
  # PR is docs-only (the e2e jobs) or outside a verify job's path filter (--filtered). cancelled, failure, and a skip
  # the rule did not order are red (ci-diet D3).
  gate:
    name: gate
    if: always()
    needs:
      [changes, typecheck-build, e2e-api, e2e-authed, design-contract, verify-outbox, verify-flags]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Every job passed, or was skipped by the docs-only rule or its path filter
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: >-
          node scripts/ci-gate.mjs --skippable e2e-api,e2e-authed,design-contract
          --filtered verify-outbox=verify_outbox,verify-flags=verify_flags
