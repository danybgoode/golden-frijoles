name: CI

# The deterministic pre-merge gate (Roadmap/WAYS-OF-WORKING.md → Review & merge).
#   typecheck-build — every static check, cheapest first, then typecheck + build.
#   e2e             — Playwright against a LOCAL Supabase and locally built servers: the suite needs a database it
#                     can seed and clean, plus a second, differently-enved server to prove the dark contracts. A
#                     Vercel preview offers neither (it points at production Supabase and carries one env set).
# Minutes: the repo is public, so GitHub-hosted standard runners are free and wall clock is the scarce thing.
# If the repo ever goes private again, revisit the job split (ci-diet D9).

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck-build:
    name: Static gate + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # format-changed and the coverage ratchet diff against the PR base; a shallow clone makes them no-op
          # silently.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      # Zero-dependency guards run before install, so drift fails fast and cheap.
      - name: Template-drift guard
        run: node scripts/check-template-drift.mjs
      - name: BUILD-ORDER.md is up to date
        run: node scripts/build-order.mjs --check
      # Replay only. Shadow expiry is a DATE, so here it would turn every unrelated PR red; jev-expiry.yml runs it
      # daily instead, and that red run is what forces the promote/tune/drop decision.
      - name: Jev — eval replay
        run: node scripts/jev-eval.mjs --no-expiry
      - name: Permissions contract
        run: node scripts/permissions-smoke.mjs
      - name: Script parity with the template
        run: node scripts/check-script-parity.mjs
      - name: Design-drift guard
        run: node scripts/check-design-drift.mjs

      - run: npm ci --no-audit --no-fund
      - name: Lint
        run: npm run lint
      # New files only — the script's header says why modified legacy files are exempt.
      - name: Format (files this PR adds)
        env:
          PRETTIER_BASE_REF: ${{ github.event.pull_request.base.sha }}
        run: npm run format:changed
      # Every node:test under scripts/, optimize/, apps/web and packages — ~1s, so it runs in front of the build.
      - name: Unit tests (pure logic)
        run: npm run test:unit
      - name: The generated design contract is in sync with the approved prototype
        run: node apps/web/design-system/extract-css.mjs --check
      # The ratchet diffs against the PR base, which resolves because this workflow is pull_request-only; the
      # script refuses an empty base rather than passing. pipefail, because bash -e alone reports tee's status.
      - name: Design coverage + ratchet
        env:
          COVERAGE_BASE_REF: ${{ github.event.pull_request.base.sha }}
        run: |
          set -o pipefail
          node scripts/design-coverage.mjs --check | tee -a "$GITHUB_STEP_SUMMARY"
      # Four tsconfig projects (app, app tests, sdk, cli + their tests): `tsc -p apps/web` alone is a subset.
      - name: Type-check (app + tests, web + sdk + cli)
        run: npm run typecheck
      - name: Build
        run: npm run build

  e2e:
    name: Playwright vs local Supabase + local server
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund

      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Start local Supabase (applies migrations + seed.sql)
        working-directory: apps/web
        run: supabase start

      # Export whatever THIS run's CLI issued, never a hardcoded key (a CLI bump changed the key format once).
      # NEXT_PUBLIC_* are inlined at build time, so they must be in $GITHUB_ENV before the Build step.
      # SUPABASE_DB_URL is the migration-owner connection specs use to clean their own fixtures.
      - name: Export live local Supabase credentials
        working-directory: apps/web
        run: |
          eval "$(supabase status -o env)"
          {
            echo "SUPABASE_URL=$API_URL"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SECRET_KEY"
            echo "SUPABASE_DB_URL=$DB_URL"
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY"
          } >> "$GITHUB_ENV"

      # Built with no gate set, before either gate file is loaded.
      - name: Build
        run: npm run build

      # Gates come from ci/gates.{off,on}.env, loaded into $GITHUB_ENV before the server that reads them boots, so
      # the server and the test process after it agree by construction (ci-diet D4). A value appended later never
      # reaches an already-running process.
      - name: Load the OFF gates
        run: node scripts/lib/gate-env.mjs ci/gates.off.env >> "$GITHUB_ENV"

      # The dark contracts, against a real second server with every gate off. Every spec here branches on its gate.
      - name: Verify the dark contracts with every gate OFF
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3100
        run: |
          set -euo pipefail
          ./node_modules/.bin/next start apps/web --hostname 127.0.0.1 --port 3100 > /tmp/off-server.log 2>&1 &
          off_pid=$!
          # SIGTERM, then SIGKILL after 2s: a server that ignores TERM must not hang the job.
          trap 'kill "$off_pid" 2>/dev/null || true; sleep 2; kill -9 "$off_pid" 2>/dev/null || true; wait "$off_pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:3100/llms.txt > /dev/null && break; sleep 1; done
          curl -sf http://127.0.0.1:3100/llms.txt > /dev/null || { echo "::error::OFF app never became ready"; cat /tmp/off-server.log; exit 1; }
          ./node_modules/.bin/playwright test --config=apps/web/playwright.config.ts --project=api \
            apps/web/e2e/journey-dark.spec.ts \
            apps/web/e2e/experiment-governance-dark.spec.ts \
            apps/web/e2e/flag-serving-dark.spec.ts \
            apps/web/e2e/scenario-dark.spec.ts \
            apps/web/e2e/setup-routes-dark.spec.ts \
            apps/web/e2e/flag-console-dark.spec.ts \
            apps/web/e2e/signup.spec.ts \
            || { cat /tmp/off-server.log; exit 1; }

      - name: Load the ON gates
        run: node scripts/lib/gate-env.mjs ci/gates.on.env >> "$GITHUB_ENV"
      # Before the server boots, for the same reason as the gates: the server must see it from its first request.
      - name: Generate the self-tracking project's API key
        run: echo "SELF_PROJECT_API_KEY=$(openssl rand -hex 24)" >> "$GITHUB_ENV"

      - name: Start the app in the background
        working-directory: apps/web
        run: |
          npm run start > /tmp/next-server.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:3000 > /dev/null && exit 0; sleep 1; done
          echo "::error::App never became ready"; exit 1

      - name: Seed the public demo project
        run: npm run seed:demo
        env:
          GROWTH_ENGINE_URL: http://localhost:3000
      # Upserts the key generated above, so the stored hash matches what the running server was booted with.
      - name: Seed the self-tracking project
        run: npm run seed:self
        env:
          GROWTH_ENGINE_URL: http://localhost:3000

      - name: Run Playwright api suite
        run: npm run test:e2e

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # Opens the approved prototype in a real browser: the measured spec and state contract must reproduce, and
      # every approved state must render. The authed suite reads STATE-CONTRACT.json, which this verifies first.
      - name: The measured spec and the state contract reproduce, and every approved state renders
        run: |
          node apps/web/design-system/measure-contract.mjs --check
          node apps/web/design-system/state-contract.mjs --check
          node apps/web/design-system/render-reference.mjs

      # The WHOLE authed project, never a file list: a hand-maintained list missed seven suites, one at a time.
      # auth-setup / auth-teardown run as its dependency graph.
      - name: Run Playwright authed suite (incl. the console visual gate)
        run: npx playwright test --config=apps/web/playwright.config.ts --project=authed

      - name: Upload the visual gate's screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: console-visual
          path: |
            test-results/console-visual/
            test-results/design-system/
          if-no-files-found: ignore

      - name: Dump Next.js server log (diagnostics)
        if: always()
        run: cat /tmp/next-server.log || true
