# Push golden-beans' own roadmap to the Hub — on the EVENT that moved a card (board-sinks-and-scrumban S1.3, D18).
#
# golden-beans is tenant #0. It dogfoods the client-pushes rail through the SAME public endpoint, with the SAME kind
# of API key a customer uses. There is no privileged internal path — the engine never reads anyone's git, including
# its own: CI pushes, the Hub renders.
#
# ── Why these triggers (D13/D18) ──────────────────────────────────────────────────────────────────────────
# A card's stage is decided by facts git and GitHub already hold: a work branch on origin is Building, a ready PR is
# QA, back to draft is Building, a merge with no close-out is QA, `status: shipped` on main is Shipped. So the board
# re-renders on exactly those events — a branch created or deleted, a PR opened / readied / drafted / closed, a docs
# commit on main — and never because somebody remembered to edit a doc. Only work branches
# (`feat|fix|chore|spike|bug|docs/…`) trigger it: dependabot and `claude/` branches name no initiative.
#
# ── What every run reads ──────────────────────────────────────────────────────────────────────────────────
# The DEFAULT BRANCH's docs, whatever the trigger: the docs SSOT is `main`, and a feature branch's half-edited
# Roadmap/ must never reach the Hub. The stamp it pushes is that commit. The git/GitHub facts are global (one
# `git ls-remote`, one `gh pr list` — lib/stage-facts.mjs), so the event that fired the run is in them.
#
# ── One concurrency group, not one per ref ────────────────────────────────────────────────────────────────
# Every run pushes the WHOLE board, so the newest facts must win: a per-ref group would let an older run on another
# ref finish last and push a stale board over a fresh one. GitHub keeps at most one pending run per group and drops
# the older pending one, which is exactly "the latest wins". `cancel-in-progress: false` so a push in flight is never
# cut off half-way. An unchanged board is not stored again (the route's D16 check), so a burst of events costs
# runs, not artifacts.
#
# ── Without the secret it is a clean skip ─────────────────────────────────────────────────────────────────
# `scripts/roadmap-push.mjs` exits 0 when SELF_PROJECT_API_KEY is unset — a fork PR gets no secrets, and this
# repo's fork PRs are filtered out below anyway. Turning the key on was a deliberate, named act (pod-report).

name: Push roadmap artifact

on:
  push:
    branches: [main]
  create:
  delete:
  pull_request:
    types: [opened, reopened, ready_for_review, converted_to_draft, closed]
  workflow_dispatch:
# The Pod Report push lives in pod-report-push.yml (ci-diet S3.3): on deployment_status only, so it no longer adds a
# "skipping" row to every PR's checks.

permissions:
  contents: read
  # `gh pr list` (the board's PR facts) needs it. Without it the push still succeeds, but with "no PR facts", which
  # on the board would read every open PR as plain Building.
  pull-requests: read

jobs:
  push-roadmap:
    name: Push roadmap to the engine
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push' ||
      ((github.event_name == 'create' || github.event_name == 'delete') &&
       github.event.ref_type == 'branch' &&
       (startsWith(github.event.ref, 'feat/') || startsWith(github.event.ref, 'fix/') ||
        startsWith(github.event.ref, 'chore/') || startsWith(github.event.ref, 'spike/') ||
        startsWith(github.event.ref, 'bug/') || startsWith(github.event.ref, 'docs/'))) ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       (startsWith(github.head_ref, 'feat/') || startsWith(github.head_ref, 'fix/') ||
        startsWith(github.head_ref, 'chore/') || startsWith(github.head_ref, 'spike/') ||
        startsWith(github.head_ref, 'bug/') || startsWith(github.head_ref, 'docs/')))
    runs-on: ubuntu-latest
    concurrency:
      group: roadmap-push
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          # FULL history: each row's `status_date` (and so a card's `shipped_at`, which decides the board's
          # "Shipped in the last 30 days") is the last commit that touched its status line. On a depth-1 clone every
          # date would collapse to the checkout's own commit.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # No `npm ci`: the extractor and the push script are zero-dependency, and this job now runs on every branch
      # and PR event rather than once per deploy.
      - name: Push the roadmap artifact
        env:
          GROWTH_ENGINE_URL: ${{ vars.SITE_URL || 'https://goldenfrijoles.com' }}
          SELF_PROJECT_API_KEY: ${{ secrets.SELF_PROJECT_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/roadmap-push.mjs
      # grounded-bets D4 — our own North Star input, computed from the bets and pushed on every merge to main. Skips
      # cleanly (exit 0) without a key. ONLY from main (Codex, #334): the route keeps the first value of a day, so a
      # manual dispatch from another branch, whose workflow file is that branch's, must never write the day's reading.
      - name: Push grounded_bets_share
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env:
          GROWTH_ENGINE_URL: ${{ vars.SITE_URL || 'https://goldenfrijoles.com' }}
          SELF_PROJECT_API_KEY: ${{ secrets.SELF_PROJECT_API_KEY }}
        run: node scripts/bets-grounded.mjs --push
