# The Jev shadow rot guard, on a clock (jev-semantic-guards D8). ci.yml replays the eval set on every PR with
# --no-expiry (a date must not block unrelated PRs), so THIS run is the one that goes red past `shadowExpires`. Expiry
# is a date, not a diff: this runs daily and fails loudly — `node scripts/jev-eval.mjs` without the flag
# runs (offline replay of recorded answers; never calls the API, needs no secret).
name: jev-expiry

on:
  schedule:
    - cron: '17 13 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  jev-expiry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: jev — eval replay + shadow expiry
        run: node scripts/jev-eval.mjs
